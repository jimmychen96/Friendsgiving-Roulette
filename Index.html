<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friendsgiving Roulette</title><style> *{box-sizing:border-box}body{margin:0;background:#fff5e5;color:#44271d;font:16px system-ui,sans-serif}main{max-width:520px;margin:auto;padding:24px 18px;text-align:center}h1{font-size:32px;margin:8px 0}p{line-height:1.5}canvas{width:100%;max-width:440px}input,button{font:inherit;border-radius:12px;padding:14px;border:1px solid #c9a88a;width:100%;margin:5px 0}button{background:#a44325;color:white;font-weight:700;border:0;cursor:pointer}button:disabled{opacity:.5}button.secondary{background:#ead6bd;color:#44271d}#result{font-size:23px;font-weight:bold;min-height:60px;margin:10px 0}ol{text-align:left;padding-left:28px}li{padding:9px 0;border-bottom:1px solid #e7cdb0}small{display:block;line-height:1.5} </style><main><div style="font-size:45px">🦃</div><h1>Friendsgiving Roulette</h1><p>18 friends · 18 dishes · One feast</p><strong id="count"></strong><canvas id="wheel" width="700" height="700" aria-label="Wheel of remaining dishes"></canvas><input id="person" placeholder="Enter your name" maxlength="60" autocomplete="off"><button id="spin">🎰 Spin the wheel</button><div id="result" role="status" aria-live="polite"></div><button class="secondary" id="share">Share dish assignments</button><h2>Who's cooking what?</h2><ol id="list"></ol><button class="secondary" id="reset">Reset lottery</button><small>Assignments are saved on this device when supported. Use one host device to avoid duplicate dishes. Separate copies do not sync.</small></main><script>
const dishes=['Roasted Turkey','Honey Glazed Ham','Prime Rib','Garlic Mashed Potatoes','Baked Mac & Cheese','Sausage Stuffing','Sweet Potato Casserole','Green Bean Casserole','Creamed Corn','Brussels Sprouts & Bacon','Honey Glazed Carrots','Homemade Dinner Rolls','Deviled Eggs','Charcuterie Board','Spinach Artichoke Dip','Pumpkin Pie','Apple Pie','Pecan Cheesecake'];const $=id=>document.getElementById(id);let assigned=[];try{assigned=JSON.parse(localStorage.getItem('friendsgiving2026')||'[]')}catch(e){}let busy=false,angle=0;const remaining=()=>dishes.filter(d=>!assigned.some(a=>a.dish===d));const ctx=$('wheel').getContext('2d');const colors=['#a44325','#e7ad54','#65774b','#884b36','#f1cb89','#bd6836'];function draw(){let items=remaining(),n=items.length;ctx.clearRect(0,0,700,700);if(!n){ctx.font='bold 35px system-ui';ctx.fillStyle='#44271d';ctx.textAlign='center';ctx.fillText('Happy Friendsgiving!',350,350);return}let step=2*Math.PI/n;items.forEach((d,i)=>{let a=angle+i*step;ctx.beginPath();ctx.moveTo(350,350);ctx.arc(350,350,323,a,a+step);ctx.closePath();ctx.fillStyle=colors[i%6];ctx.fill();ctx.strokeStyle='#fff5e5';ctx.lineWidth=2;ctx.stroke();ctx.save();ctx.translate(350,350);ctx.rotate(a+step/2);ctx.fillStyle=[1,4].includes(i%6)?'#44271d':'#fff';ctx.font='bold '+(n>12?19:23)+'px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(d,308,0,265);ctx.restore()});ctx.beginPath();ctx.arc(350,350,38,0,Math.PI*2);ctx.fillStyle='#fff5e5';ctx.fill();ctx.font='39px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🦃',350,350);ctx.beginPath();ctx.moveTo(698,328);ctx.lineTo(698,372);ctx.lineTo(650,350);ctx.closePath();ctx.fillStyle='#44271d';ctx.fill()}
function update(){try{localStorage.setItem('friendsgiving2026',JSON.stringify(assigned))}catch(e){}$('count').textContent=assigned.length+' / 18 dishes assigned';$('list').replaceChildren(...assigned.map(a=>{let li=document.createElement('li');li.textContent=a.name+' — '+a.dish;return li}));$('spin').disabled=busy||!remaining().length;$('reset').disabled=busy;draw()}
$('spin').onclick=()=>{let name=$('person').value.trim();if(!name){$('result').textContent='Enter your name first!';return}if(assigned.some(a=>a.name.toLowerCase()===name.toLowerCase())){$('result').textContent='This person already has a dish!';return}let items=remaining();if(busy||!items.length)return;busy=true;$('spin').disabled=true;$('reset').disabled=true;$('person').disabled=true;let i=Math.floor(Math.random()*items.length),dish=items[i],start=angle,target=-(i+.5)*2*Math.PI/items.length,delta=((target-start)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)+10*Math.PI,t0=performance.now();function frame(t){let p=Math.min(1,(t-t0)/3500);angle=start+delta*(1-(1-p)**4);draw();if(p<1)return requestAnimationFrame(frame);assigned.push({name,dish});$('result').textContent='🎉 '+name+' is making '+dish+'!';$('person').value='';$('person').disabled=false;busy=false;angle=0;update()}requestAnimationFrame(frame)};
$('reset').onclick=()=>{if(confirm('Clear all dish assignments?')){assigned=[];angle=0;$('result').textContent='';update()}};$('share').onclick=async()=>{let text='🦃 FRIENDSGIVING DISH ASSIGNMENTS\n\n'+assigned.map((a,i)=>(i+1)+'. '+a.name+' — '+a.dish).join('\n');try{if(navigator.share){await navigator.share({title:'Friendsgiving',text});return}await navigator.clipboard.writeText(text);$('result').textContent='Assignments copied!'}catch(e){prompt('Copy these assignments:',text)}};update();</script></html>
